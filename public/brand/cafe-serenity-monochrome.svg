<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100" fill="none">
  <!-- Circular Fork & Knife Emblem -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" stroke="#1c1917" stroke-width="4.5" fill="none" />
    <!-- Fork -->
    <path d="M30 38v20M25 22v7a5 5 0 0 0 10 0v-7M30 22v7" stroke="#1c1917" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Knife -->
    <path d="M48 38v20M44 38V25c0-4 2-6 4-6v19z" fill="#1c1917" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Wordmark -->
  <text x="110" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" fill="#1c1917" letter-spacing="1.5">CAFÉ SERENITY</text>
  <text x="110" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#1c1917" letter-spacing="5">KAKKANAD</text>
</svg>
